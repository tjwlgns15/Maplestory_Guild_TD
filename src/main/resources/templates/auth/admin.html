<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>관리자 - 메이플 길드 TD</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --primary: #f6a623; --text: #e6edf3; --muted: #8b949e;
            --danger: #f85149; --success: #3fb950; --radius: 8px;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

        /* ── 로그인 ── */
        #loginWrap {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 2rem; width: 340px;
        }
        .login-card h2 { margin-bottom: 1.5rem; font-size: 1.3rem; }
        .form-group { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; font-size: .9rem; color: var(--muted); }
        .form-group input, .form-group select, .form-group textarea {
            background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
            color: var(--text); padding: .55rem .8rem; font-size: .9rem; outline: none;
            transition: border-color .2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }

        /* ── 대시보드 ── */
        #dashWrap { display: none; }
        .topbar {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: .8rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
        }
        .topbar h1 { font-size: 1.1rem; }
        .topbar span { color: var(--muted); font-size: .88rem; }

        /* ── 탭 ── */
        .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 1.5rem; background: var(--surface); }
        .tab-btn {
            background: none; border: none; color: var(--muted); padding: .8rem 1.3rem;
            cursor: pointer; font-size: .9rem; border-bottom: 2px solid transparent;
            transition: all .2s;
        }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* ── 탭 콘텐츠 ── */
        .tab-content { display: none; padding: 1.5rem; }
        .tab-content.active { display: block; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .section-header h3 { font-size: 1rem; }

        /* ── 테이블 ── */
        table { width: 100%; border-collapse: collapse; font-size: .88rem; }
        th, td { padding: .65rem 1rem; border-bottom: 1px solid var(--border); text-align: left; }
        th { color: var(--muted); font-weight: 500; background: var(--surface); }
        tr:hover td { background: rgba(255,255,255,0.03); }
        .color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
        .badge {
            display: inline-block; padding: .15rem .5rem; border-radius: 99px;
            font-size: .75rem; font-weight: 600;
        }
        .badge-passive { background: rgba(46,204,113,.2); color: #2ecc71; }
        .badge-active  { background: rgba(231,76,60,.2);  color: #e74c3c; }

        /* ── 버튼 ── */
        .btn { padding: .45rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-size: .85rem; font-weight: 600; transition: opacity .2s; }
        .btn:hover { opacity: .85; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-sm { padding: .3rem .7rem; font-size: .78rem; }
        .btn-edit   { background: rgba(246,166,35,.2); color: var(--primary); border: 1px solid var(--primary); }
        .btn-delete { background: rgba(248,81,73,.15); color: var(--danger); border: 1px solid var(--danger); }
        .btn-logout { background: transparent; color: var(--muted); border: 1px solid var(--border); }
        .btn-danger { background: var(--danger); color: #fff; }

        /* ── 모달 ── */
        .modal-bg {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.65); z-index: 100;
            align-items: center; justify-content: center;
        }
        .modal-bg.open { display: flex; }
        .modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.8rem; width: 520px; max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 { margin-bottom: 1.2rem; font-size: 1.05rem; }
        .modal-footer { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.2rem; }
        .conditional { display: none; }

        /* ── 필터 ── */
        .filter-row { display: flex; gap: .6rem; margin-bottom: 1rem; align-items: center; }
        .filter-row select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: .4rem .7rem; border-radius: 6px; font-size: .85rem; }

        /* ── 기타 ── */
        .empty { color: var(--muted); text-align: center; padding: 2rem; font-size: .9rem; }
        .err-text { color: var(--danger); font-size: .82rem; margin-top: .4rem; min-height: 1rem; }
    </style>
</head>
<body>

<!-- ── 로그인 ── -->
<div id="loginWrap">
    <div class="login-card">
        <h2>🔐 관리자 로그인</h2>
        <div class="form-group">
            <label>아이디</label>
            <input type="text" id="loginUser" placeholder="username" />
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="loginPass" placeholder="password" />
        </div>
        <p class="err-text" id="loginErr"></p>
        <button class="btn btn-primary" style="width:100%;margin-top:.3rem" onclick="login()">로그인</button>
    </div>
</div>

<!-- ── 대시보드 ── -->
<div id="dashWrap">
    <div class="topbar">
        <h1>⚙️ 관리자 대시보드</h1>
        <div style="display:flex;align-items:center;gap:1rem">
            <span id="adminUser"></span>
            <button class="btn btn-sm btn-logout" onclick="logout()">로그아웃</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="jobClass">직업군</button>
        <button class="tab-btn" data-tab="skill">스킬</button>
        <button class="tab-btn" data-tab="job">직업</button>
    </div>

    <!-- 직업군 탭 -->
    <div class="tab-content active" id="tab-jobClass">
        <div class="section-header">
            <h3>직업군 관리</h3>
            <button class="btn btn-primary btn-sm" onclick="openJobClassModal()">+ 직업군 추가</button>
        </div>
        <table>
            <thead><tr><th>이름</th><th>사거리</th><th>쿨다운(ms)</th><th>색상</th><th>관리</th></tr></thead>
            <tbody id="jobClassTable"></tbody>
        </table>
    </div>

    <!-- 스킬 탭 -->
    <div class="tab-content" id="tab-skill">
        <div class="section-header">
            <h3>스킬 관리</h3>
            <button class="btn btn-primary btn-sm" onclick="openSkillModal()">+ 스킬 추가</button>
        </div>
        <div class="filter-row">
            <span style="color:var(--muted);font-size:.85rem">필터:</span>
            <select id="skillKindFilter" onchange="loadSkills()">
                <option value="">전체</option>
                <option value="PASSIVE">패시브</option>
                <option value="ACTIVE">액티브</option>
            </select>
        </div>
        <table>
            <thead><tr><th>이름</th><th>종류</th><th>효과 타입</th><th>효과값</th><th>쿨다운</th><th>관리</th></tr></thead>
            <tbody id="skillTable"></tbody>
        </table>
    </div>

    <!-- 직업 탭 -->
    <div class="tab-content" id="tab-job">
        <div class="section-header">
            <h3>직업 관리</h3>
            <button class="btn btn-primary btn-sm" onclick="openJobModal()">+ 직업 추가</button>
        </div>
        <div class="filter-row">
            <span style="color:var(--muted);font-size:.85rem">필터:</span>
            <select id="jobClassFilter" onchange="loadJobs()">
                <option value="">전체</option>
            </select>
        </div>
        <table>
            <thead><tr><th>직업명</th><th>직업군</th><th>패시브 스킬</th><th>액티브 스킬</th><th>관리</th></tr></thead>
            <tbody id="jobTable"></tbody>
        </table>
    </div>
</div>

<!-- ── 공용 모달 ── -->
<div class="modal-bg" id="modalBg">
    <div class="modal">
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn btn-sm btn-logout" onclick="closeModal()">취소</button>
            <button class="btn btn-sm btn-primary" id="modalConfirm">저장</button>
        </div>
    </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
